# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm install
    - run: CI=false npm run build --if-present
      if: always()

  
    - name: FTP Deploy standalone (Next.js server)
      if: always()
  # You may pin to the exact commit or the version.
  # uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      with:
        # ftp server
        server: ${{ secrets.SERVER }}
        # ftp username
        username: ${{ secrets.USERNAME }}
        # ftp password
        password: ${{ secrets.PASSWORD }}
        # Folder to upload from, must end with trailing slash /
        local-dir: ./.next/standalone/
        # Path to upload to on the server. Must end with trailing slash /
        server-dir: /public_html/standalone/
        # protocol to deploy with - ftp, ftps, or ftps-legacy
        protocol: ftp
        port: 21
        security: loose
        passive: true
        concurrency: 1
        timeout: 180000
        sync: true
        log-level: verbose
        dangerous-clean-slate: false
        # Path and name of the state file - this file is used to track which files have been deployed
        exclude: |
          **/cgi-bin*

    - name: Wait before next deploy
      run: sleep 5

    - name: FTP Deploy Deploy static assets
      if: always()
    # You may pin to the exact commit or the version.
    # uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      with:
        # ftp server
        server: ${{ secrets.SERVER }}
        # ftp username
        username: ${{ secrets.USERNAME }}
        # ftp password
        password: ${{ secrets.PASSWORD }}
        # Folder to upload from, must end with trailing slash /
        local-dir: ./.next/static/
        # Path to upload to on the server. Must end with trailing slash /
        server-dir: /public_html/static/
        # protocol to deploy with - ftp, ftps, or ftps-legacy
        protocol: ftp
        port: 21
        security: loose
        passive: true
        concurrency: 1
        timeout: 180000
        sync: true
        log-level: verbose
        dangerous-clean-slate: false
        # Path and name of the state file - this file is used to track which files have been deployed
        exclude: |
          **/cgi-bin*

    - name: Wait before next deploy
      run: sleep 5

    - name: FTP Deploy public folder
      if: always()
    # You may pin to the exact commit or the version.
    # uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      with:
        # ftp server
        server: ${{ secrets.SERVER }}
        # ftp username
        username: ${{ secrets.USERNAME }}
        # ftp password
        password: ${{ secrets.PASSWORD }}
        # Folder to upload from, must end with trailing slash /
        local-dir: ./public/
        # Path to upload to on the server. Must end with trailing slash /
        server-dir: /public_html/public/
        # protocol to deploy with - ftp, ftps, or ftps-legacy
        protocol: ftp
        port: 21
        security: loose
        passive: true
        concurrency: 1
        timeout: 180000
        sync: true
        log-level: verbose
        dangerous-clean-slate: false
        # Path and name of the state file - this file is used to track which files have been deployed
        exclude: |
          **/cgi-bin*