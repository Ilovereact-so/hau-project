name: Deploy staging

on:
  push:
    branches: ['staging']
  # Ręczne uruchomienie: Actions → Deploy staging → Run workflow.
  workflow_dispatch:

# Dwa transfery FTP naraz rozjechałyby pliki na serwerze — kolejkujemy.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build i wdrożenie
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90

    # `src/lib/redis.ts` łączy się z Redisem już przy imporcie modułu, a Next
    # importuje wszystkie trasy na etapie „Collecting page data”. Bez Redisa
    # build stanąłby na ECONNREFUSED. To Redis WYŁĄCZNIE na czas budowania —
    # produkcyjny adres (na tym hostingu gniazdo uniksowe) jest w `.env`.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      # Ta sama wersja co na hostingu (panel Node.js: 22.23.2).
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # `npm ci` zamiast `npm install`: instaluje dokładnie to, co jest
      # w package-lock.json, więc build w CI = build lokalny.
      - name: Instalacja zależności
        run: npm ci

      - name: Build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          # Redis z serwisu powyżej — tylko po to, żeby import modułu przeszedł.
          REDIS_URL: redis://127.0.0.1:6379

          # --- wkompilowywane w paczkę przeglądarki (MUSZĄ być tutaj) ---
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
          NEXT_PUBLIC_CLERK_RESET_PASSWORD_URL: ${{ secrets.NEXT_PUBLIC_CLERK_RESET_PASSWORD_URL }}
          NEXT_PUBLIC_CLERK_VERIFY_EMAIL_URL: ${{ secrets.NEXT_PUBLIC_CLERK_VERIFY_EMAIL_URL }}
          NEXT_PUBLIC_FURGONETKA_MAP_API_KEY: ${{ secrets.NEXT_PUBLIC_FURGONETKA_MAP_API_KEY }}
          # Środowisko Furgonetki dla mapy I API (lib/furgonetkaEnv.ts). Staging
          # domyślnie w piaskownicy: klucz mapy i dane OAuth muszą być z tego
          # samego środowiska, inaczej /points/map zwraca 403. Na produkcyjne
          # konto: zmienna `FURGONETKA_ENV=production` w środowisku staging.
          NEXT_PUBLIC_FURGONETKA_ENV: ${{ vars.FURGONETKA_ENV || 'sandbox' }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          # Dane sprzedawcy (stopka, maile) — jawne, więc jako zmienne (vars), nie sekrety.
          NEXT_PUBLIC_SELLER_NAME: ${{ vars.SELLER_NAME }}
          NEXT_PUBLIC_SELLER_ADDRESS: ${{ vars.SELLER_ADDRESS }}
          NEXT_PUBLIC_SELLER_NIP: ${{ vars.SELLER_NIP }}
          NEXT_PUBLIC_SELLER_REGISTRY: ${{ vars.SELLER_REGISTRY }}
          NEXT_PUBLIC_SELLER_EMAIL: ${{ vars.SELLER_EMAIL }}
          NEXT_PUBLIC_SELLER_PHONE: ${{ vars.SELLER_PHONE }}

          # --- czytane przy prerenderowaniu stron ---
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}

          # --- decyzje zapadające przy budowaniu ---
          CSP_MODE: ${{ vars.CSP_MODE || 'report-only' }}
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE || 'false' }}
        
        run: |
          missing=0
          for name in NEXT_PUBLIC_APP_URL NEXT_PUBLIC_SANITY_PROJECT_ID \
                      NEXT_PUBLIC_SANITY_DATASET NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY \
                      NEXT_PUBLIC_FURGONETKA_MAP_API_KEY; do
            if [ -z "$(printenv "$name" | tr -d '[:space:]')" ]; then
              echo "::error::Brak sekretu $name w środowisku 'staging' (GitHub → Settings → Environments → staging → Environment secrets)."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          npm run build

      
      - name: Skompletowanie paczki
        run: |
          set -euo pipefail

          # `.next/static` NIE jest kopiowane do paczki: Apache serwuje te pliki
          # wprost z `public_html/_next/static` (tak działa też druga aplikacja
          # na tym koncie). Podwójna kopia tylko podwajałaby transfer FTP.
          rm -rf .next/standalone/.next/static .next/standalone/public
          if [ -d public ]; then cp -r public .next/standalone/; fi

          # Plik startowy dla Passengera. Musi ustawić HOSTNAME przed
          # załadowaniem server.js — patrz punkt 3 w nagłówku pliku.
          cat > .next/standalone/start.js <<'JS'
          // Plik startowy aplikacji w panelu Node.js (DirectAdmin/Passenger).
          // Generowany przez .github/workflows/node.js.yml — nie edytuj na serwerze.
          //
          // HOSTNAME musi być ustawiony ZANIM załaduje się server.js: Next buduje
          // z niego adres bazowy routera i porównuje go z rewrite'em zwracanym
          // przez middleware (Clerk przepisuje żądanie na localhost:PORT). Gdy
          // originy się różnią, Next traktuje rewrite jak adres zewnętrzny
          // i proxuje żądanie sam do siebie — zawieszenie i 500 po 30 sekundach.
          //
          // Na sztywno, bo powłoka hostingu podstawia tu nazwę maszyny.
          process.env.HOSTNAME = 'localhost'

          // `import()`, nie `require()`: projekt ma "type": "module", więc Next
          // generuje server.js jako ESM, a ten plik może zostać załadowany
          // i jako CommonJS (Passenger), i jako ESM (`node start.js`).
          // Dynamiczny import działa w obu trybach.
          import('./server.js').catch((err) => {
            console.error(err)
            process.exit(1)
          })
          JS

          # Pliki dla przycisku „Uruchom NPM Install” w katalogu głównym aplikacji.
          # NIE pełny package.json projektu, tylko zależności runtime wyciągnięte
          # ze skompilowanych chunków (next, react, jsdom dla Studio…), z dokładnymi
          # wersjami z tego builda i własnym lockfile. Powód: panel (CloudLinux)
          # instaluje w ~/nodevenv/…/lib, więc `.npmrc` z public_html jest
          # ignorowany, a pełna lista ciągnęła tsx/vite/sanity z trzema wersjami
          # esbuilda — skrypt instalacyjny esbuilda wywracał instalację
          # („Expected "0.28.2" but got "0.25.12"”). Szczegóły w skrypcie.
          node scripts/deployPackage.mjs deploy-root

          test -f .next/standalone/server.js
          test -f .next/standalone/start.js
          test -f .next/standalone/package.json
          test -f .next/standalone/.next/BUILD_ID

          echo "--- BUILD_ID: $(cat .next/standalone/.next/BUILD_ID) ---"
          echo "--- plików w .next/static:  $(find .next/static -type f | wc -l)"
          echo "--- plików w standalone/.next: $(find .next/standalone/.next -type f | wc -l)"
          echo "--- plików w reszcie paczki:  $(find .next/standalone -type f -not -path "*/node_modules/*" -not -path "*/.next/*" | wc -l)"

     
      - name: Test paczki serwerowej
        run: |
          set -euo pipefail
          SRV="$RUNNER_TEMP/public_html"
          rm -rf "$SRV" && mkdir -p "$SRV"
          cp deploy-root/package.json deploy-root/package-lock.json "$SRV/"
          (cd "$SRV" && npm ci --no-audit --no-fund)
          cp -r .next/standalone "$SRV/standalone"
          rm -rf "$SRV/standalone/node_modules"
          node -e "require('$SRV/node_modules/jsdom')"

          # Redis z serwisu — bez niego moduły tras nie wstaną przy imporcie.
          (cd "$SRV/standalone" && PORT=3123 REDIS_URL=redis://127.0.0.1:6379 \
            node start.js > "$RUNNER_TEMP/server.log" 2>&1 &)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3123/favicon.ico || true)
            if [ "$code" = "200" ]; then echo "Serwer odpowiada (favicon: 200)"; break; fi
            sleep 1
          done
          pkill -f "node start.js" || true
          if [ "${code:-}" != "200" ]; then
            echo "Serwer nie wstał na zależnościach z deploy-root (ostatni kod: ${code:-brak})"
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi

      
      - name: FTP — statyki (_next/static)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          port: 21
          security: loose
          local-dir: ./.next/static/
          server-dir: /public_html/_next/static/
          timeout: 180000
          log-level: standard
          dangerous-clean-slate: false
          exclude: |
            **/*.map

      - name: Przerwa
        run: sleep 20

      
      - name: FTP — skompilowana aplikacja (standalone/.next)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          port: 21
          security: loose
          local-dir: ./.next/standalone/.next/
          server-dir: /public_html/standalone/.next/
          timeout: 180000
          log-level: standard
          dangerous-clean-slate: false
          exclude: |
            **/*.map

      - name: Przerwa
        run: sleep 20

      # server.js, start.js, package.json i katalog public.
      - name: FTP — pliki startowe i public (standalone)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          port: 21
          security: loose
          local-dir: ./.next/standalone/
          server-dir: /public_html/standalone/
          timeout: 180000
          log-level: standard
          dangerous-clean-slate: false
          # `.next` wgrywa krok wyżej, `node_modules` zostaje na serwerze,
          # a `.env` jest wgrany ręcznie i nie może zostać nadpisany.
          exclude: |
            .next/**
            **/.next/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/.git*
            **/.git*/**
            **/*.map

      - name: Przerwa
        run: sleep 20

      - name: FTP — package.json w katalogu aplikacji
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          port: 21
          security: loose
          local-dir: ./deploy-root/
          server-dir: /public_html/
          timeout: 180000
          log-level: standard
          dangerous-clean-slate: false

      # Passenger nie podmienia procesu sam — dopóki go nie zrestartujesz,
      # serwuje stary build.
      - name: Co zrobić na serwerze
        run: |
          echo "------------------------------------------------------------"
          echo "Pliki wgrane. W panelu Node.js:"
          echo "  1. URUCHOM PONOWNIE  <- zawsze, inaczej działa stary build"
          echo "  2. Uruchom NPM Install  <- tylko po zmianie package.json"
          echo "                             albo package-lock.json"
          echo "------------------------------------------------------------"
